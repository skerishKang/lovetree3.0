name: Frontend Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Final public demo evidence
    runs-on: ubuntu-latest
    outputs:
      focused_summary: ${{ steps.focused.outputs.summary }}
      full_summary: ${{ steps.full.outputs.summary }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify clean checkout
        shell: bash
        run: |
          git status --short
          test -z "$(git status --short)"

      - name: Check pull request diff
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Install dependencies
        run: npm ci

      - id: focused
        name: Focused public demo suite
        shell: bash
        run: |
          set +e
          output="$(npm test -- --run \
            src/utils/publicDemoGraph.test.ts \
            src/utils/publicDemoStorage.test.ts \
            src/components/EmptyTreeEditorPage.test.tsx \
            src/components/RouteGraph.test.tsx \
            src/components/PublicDemoEditorFlow.test.tsx 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          clean="$(printf '%s\n' "$output" | sed -E $'s/\x1B\[[0-9;]*[mK]//g')"
          files="$(printf '%s\n' "$clean" | grep 'Test Files' | tail -1 | xargs)"
          tests="$(printf '%s\n' "$clean" | grep -E '^Tests |^Tests  |^ +Tests ' | tail -1 | xargs)"
          echo "summary=Focused — ${files}; ${tests}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - id: full
        name: Full test suite
        shell: bash
        run: |
          set +e
          output="$(npm test -- --run 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          clean="$(printf '%s\n' "$output" | sed -E $'s/\x1B\[[0-9;]*[mK]//g')"
          files="$(printf '%s\n' "$clean" | grep 'Test Files' | tail -1 | xargs)"
          tests="$(printf '%s\n' "$clean" | grep -E '^Tests |^Tests  |^ +Tests ' | tail -1 | xargs)"
          echo "summary=Full — ${files}; ${tests}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Build
        run: npm run build

  focused-evidence:
    needs: quality
    name: ${{ needs.quality.outputs.focused_summary }}
    runs-on: ubuntu-latest
    steps: [{ run: "true" }]

  full-evidence:
    needs: quality
    name: ${{ needs.quality.outputs.full_summary }}
    runs-on: ubuntu-latest
    steps: [{ run: "true" }]

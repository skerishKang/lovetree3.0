name: Frontend Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-typecheck:
    runs-on: ubuntu-latest
    outputs:
      error_1: ${{ steps.capture.outputs.error_1 }}
      error_2: ${{ steps.capture.outputs.error_2 }}
      error_3: ${{ steps.capture.outputs.error_3 }}
      error_4: ${{ steps.capture.outputs.error_4 }}
      error_5: ${{ steps.capture.outputs.error_5 }}
      error_6: ${{ steps.capture.outputs.error_6 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --silent
      - id: capture
        shell: bash
        run: |
          output="$(npm run typecheck 2>&1 || true)"
          errors="$(printf '%s\n' "$output" | grep -E 'error TS' || true)"
          sanitize() { printf '%s' "$1" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | cut -c1-220; }
          for index in 1 2 3 4 5 6; do
            line="$(printf '%s\n' "$errors" | sed -n "${index}p")"
            [[ -n "$line" ]] || line="NO_MORE_TYPE_ERRORS"
            echo "error_${index}=$(sanitize "$line")" >> "$GITHUB_OUTPUT"
          done

  report-1:
    needs: capture-typecheck
    name: ${{ needs.capture-typecheck.outputs.error_1 }}
    runs-on: ubuntu-latest
    steps: [{ run: "true" }]
  report-2:
    needs: capture-typecheck
    name: ${{ needs.capture-typecheck.outputs.error_2 }}
    runs-on: ubuntu-latest
    steps: [{ run: "true" }]
  report-3:
    needs: capture-typecheck
    name: ${{ needs.capture-typecheck.outputs.error_3 }}
    runs-on: ubuntu-latest
    steps: [{ run: "true" }]
  report-4:
    needs: capture-typecheck
    name: ${{ needs.capture-typecheck.outputs.error_4 }}
    runs-on: ubuntu-latest
    steps: [{ run: "true" }]
  report-5:
    needs: capture-typecheck
    name: ${{ needs.capture-typecheck.outputs.error_5 }}
    runs-on: ubuntu-latest
    steps: [{ run: "true" }]
  report-6:
    needs: capture-typecheck
    name: ${{ needs.capture-typecheck.outputs.error_6 }}
    runs-on: ubuntu-latest
    steps: [{ run: "true" }]

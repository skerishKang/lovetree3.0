name: Frontend Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-by-letter:
    name: Diagnostic tests ${{ matrix.letter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        letter: [M, N, O, P, Q, R]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run matching test files
        shell: bash
        env:
          TEST_LETTER: ${{ matrix.letter }}
        run: |
          mapfile -t files < <(find src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | sort | awk -F/ -v target="$TEST_LETTER" '{ c=toupper(substr($NF,1,1)); if (c == target) print }')
          printf '%s\n' "${files[@]}"
          if ((${#files[@]})); then npx vitest --run "${files[@]}"; fi

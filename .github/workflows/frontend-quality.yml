name: Frontend Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  my-tree-tests:
    name: Diagnostic ${{ matrix.file }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: [MyTreesPage.test.tsx, MyTreesEmptyPage.test.tsx]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run selected test file
        run: npx vitest --run "src/components/${{ matrix.file }}"

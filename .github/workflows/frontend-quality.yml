name: Frontend Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-with-one-test-removed:
    name: Typecheck without ${{ matrix.file }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
          - EmptyTreeEditorPage.test.tsx
          - RouteGraph.test.tsx
          - PublicDemoEditorFlow.test.tsx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: rm "src/components/${{ matrix.file }}"
      - run: npm run typecheck

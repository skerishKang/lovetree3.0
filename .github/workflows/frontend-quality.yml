name: Frontend Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-by-prefix:
    name: Diagnostic tests ${{ matrix.prefix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prefix: [Media, Memory, My]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run matching test files
        shell: bash
        env:
          TEST_PREFIX: ${{ matrix.prefix }}
        run: |
          mapfile -t files < <(find src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | sort | awk -F/ -v prefix="$TEST_PREFIX" 'index($NF, prefix) == 1 { print }')
          printf '%s\n' "${files[@]}"
          if ((${#files[@]})); then npx vitest --run "${files[@]}"; fi

name: Frontend Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-type-error:
    runs-on: ubuntu-latest
    outputs:
      first_error: ${{ steps.capture.outputs.first_error }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --silent
      - id: capture
        name: Capture first TypeScript error
        shell: bash
        run: |
          output="$(npm run typecheck --silent 2>&1 || true)"
          first="$(printf '%s\n' "$output" | grep -m1 'error TS' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | cut -c1-220)"
          if [[ -z "$first" ]]; then first="NO_TYPESCRIPT_ERROR_FOUND"; fi
          echo "first_error=$first" >> "$GITHUB_OUTPUT"

  report-type-error:
    needs: capture-type-error
    name: ${{ needs.capture-type-error.outputs.first_error }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ needs.capture-type-error.outputs.first_error }}"

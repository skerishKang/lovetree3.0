name: Frontend Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-a-f:
    name: Diagnostic tests A-F
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run A-F test files
        shell: bash
        run: |
          mapfile -t files < <(find src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | sort | awk -F/ '{ c=toupper(substr($NF,1,1)); if (c >= "A" && c <= "F") print }')
          printf '%s\n' "${files[@]}"
          if ((${#files[@]})); then npx vitest --run "${files[@]}"; fi

  tests-g-l:
    name: Diagnostic tests G-L
